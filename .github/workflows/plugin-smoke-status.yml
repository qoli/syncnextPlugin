name: Plugin Smoke Status (Non-Managed)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: plugin-smoke-status
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Update Smoke Status
        id: smoke
        run: bun run smoke:ci:soft --job-summary-file="$GITHUB_STEP_SUMMARY"

      - name: Upload Untrusted Smoke Results
        uses: actions/upload-artifact@v7
        with:
          name: plugin-smoke-results-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            syncnextPlugin_all_plugin_test_runs/latest.json
            syncnextPlugin_all_plugin_test_runs/latest.log
            syncnextPlugin_all_plugin_test_runs/latest.summary.log
            syncnextPlugin_all_plugin_test_runs/invalid_sources_latest.json
            syncnextPlugin_all_plugin_test_runs/invalid_sources_latest.txt

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Untrusted Smoke Results
        uses: actions/download-artifact@v8
        with:
          name: plugin-smoke-results-${{ github.run_id }}
          path: ${{ runner.temp }}/plugin-smoke-results

      - name: Validate And Publish Fixed Outputs
        run: >-
          node .github/scripts/publish-smoke-artifact.js
          "$RUNNER_TEMP/plugin-smoke-results"
          "$GITHUB_WORKSPACE"

      - name: Commit Updated Status Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md syncnextPlugin_all_plugin_test_runs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🤖 chore(smoke): update plugin smoke status"
          git push
